name: Deploy documentation to Cloudflare Workers

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package:prepare
      - name: Build documentation Worker
        run: pnpm --filter @coss-svelte/www build
        env:
          CF_DEPLOY: "1"
      - name: Deploy documentation Worker
        run: pnpm --filter @coss-svelte/www exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f17f560a542d930a78879c1494aad951
          WRANGLER_SEND_METRICS: "false"
